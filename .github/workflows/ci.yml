name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest --junitxml=junit.xml -o junit_family=xunit1
      - uses: mikepenz/action-junit-report@v6.6.1
        if: ${{ !cancelled() }}
        with:
          report_paths: junit.xml
          annotate_only: true
          detailed_summary: true
          include_passed: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - run: uvx twine check --strict dist/*

  release:
    needs: [check, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Release the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(uv version --short)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          uv build
          uv publish --check-url https://pypi.org/simple/
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --generate-notes
