[deck]
name = "Histoire de France"
description = "50 repères historiques, de la Gaule à la décolonisation"
instructions = "Génère des variantes portant exclusivement sur le même fait historique précis, avec un seul élément attendu. Reformule sans déplacer la période, le protagoniste ou l’événement. Inverse une association personnage-événement ou événement-date seulement si le résultat est univoque, en nommant explicitement l’événement. N’invente jamais de causalité ni de question portant sur un autre fait. Respecte les distinctions entre date conventionnelle, date exacte et approximation (par exemple 'vers 496'). Pour corriger, accepte les chiffres romains ou arabes, les variantes de noms et les fautes mineures, mais refuse une date, une personne ou un événement incorrect. Évalue la connaissance du fait, pas la forme de la phrase. Ne crée pas de question inversée si plusieurs réponses seraient défendables."

