[project]
name = "recto"
version = "0.1.1"
description = "Learn things by heart with flashcards in the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thibault Djaballah", email = "t.djaballah@datooine.tech" }
]
keywords = ["flashcards", "spaced-repetition", "fsrs", "tui", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.49.1",
    "fsrs>=6.3.2",
    "platformdirs>=4.13.3",
    "pydantic-ai-slim[openai]>=2.57.0",
    "pydantic-settings>=2.16.0",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/tdjaballah/recto"
Issues = "https://github.com/tdjaballah/recto/issues"
Changelog = "https://github.com/tdjaballah/recto/releases"

[project.scripts]
recto = "recto.app:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
