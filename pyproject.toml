[project]
name = "frigo"
version = "0.1.0"
description = "Cook what is already in your fridge"
readme = "README.md"
authors = [
    { name = "Thibault Djaballah", email = "thibault.djaballah@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.49.1",
    "typer>=0.27.3",
]

[project.scripts]
frigo = "frigo.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
