[project]
name = "recto"
version = "0.1.0"
description = "Learn things by heart with flashcards in the terminal"
readme = "README.md"
authors = [
    { name = "Thibault Djaballah", email = "thibault.djaballah@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.49.1",
    "fsrs>=6.3.2",
    "platformdirs>=4.13.3",
    "textual>=8.2.8",
]

[project.scripts]
recto = "recto.app:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
